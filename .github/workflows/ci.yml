name: Android CI

on:
  push:
    branches: [ "main", "base-tempate" ]
  pull_request:
    branches: [ "main", "base-tempate" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Spotless Code Format Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: "**/build/reports/tests/**"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          ORG_GRADLE_PROJECT_PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

      - name: Verify Minified Release APK & ProGuard
        run: ./gradlew assembleRelease --stacktrace
        env:
          ORG_GRADLE_PROJECT_PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
