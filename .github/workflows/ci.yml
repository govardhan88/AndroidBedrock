name: Android CI

on:
  push:
    branches: [ "main", "base-tempate" ]
  pull_request:
    branches: [ "main", "base-tempate" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect file changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'core/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'local.properties.example'
              - '.github/workflows/**'

  ci:
    name: Build, Test & Verify
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d156388eb19639ec20ade50009f3d199ce1e2808 # v4.1.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Production Google Services JSON
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Run Spotless Code Format Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Generate JaCoCo Code Coverage Reports
        run: ./gradlew createDebugUnitTestCoverageReport --no-parallel --stacktrace

      - name: Run SonarCloud Code Analysis
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: ./gradlew sonar --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Test Results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: unit-test-results
          path: "**/build/reports/tests/**"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_DEV_BASE_URL: ${{ secrets.DEV_BASE_URL }}
          ORG_GRADLE_PROJECT_PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

      - name: Verify Minified Release APK & ProGuard
        run: ./gradlew assembleRelease --stacktrace
        env:
          ORG_GRADLE_PROJECT_PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Distribute to Firebase App Distribution
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@a41b2f7ab3f7c2631b6a73fb2f660b517cef45a9 # v1.7.0
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Build: #${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            ${{ github.event.head_commit.message }}
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  ci-status:
    name: CI Merge Gate
    needs: [detect-changes, ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI Status
        run: |
          BUILD_RESULT="${{ needs.ci.result }}"
          if [ "$BUILD_RESULT" = "success" ]; then
            echo "✅ Code checks passed successfully."
            exit 0
          elif [ "$BUILD_RESULT" = "skipped" ]; then
            echo "⚡ Docs-only change detected. Heavy build skipped, merge allowed."
            exit 0
          else
            echo "❌ CI failed with status: $BUILD_RESULT"
            exit 1
          fi
